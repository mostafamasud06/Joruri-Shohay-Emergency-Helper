<svg viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowEnd" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#3A4A42"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="620" fill="#FFFFFF"/>
  <text x="540" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1C2521">Joruri Shohay — Actual System Architecture</text>
  <text x="540" y="54" text-anchor="middle" font-size="12.5" fill="#5B6B63">No AWS AgentCore, Lambda, or DynamoDB used — Strands Agents + Bedrock + a Flask server, deployed simply</text>

  <!-- ============ User ============ -->
  <circle cx="90" cy="140" r="26" fill="#F5EFD9" stroke="#B8860B" stroke-width="1.5"/>
  <circle cx="90" cy="132" r="8" fill="#B8860B"/>
  <path d="M76 152 Q90 138 104 152" fill="#B8860B"/>
  <text x="90" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#1C2521">User</text>

  <!-- ============ Frontend ============ -->
  <rect x="210" y="112" width="150" height="56" rx="10" fill="#2874A6"/>
  <text x="285" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Web Frontend</text>
  <text x="285" y="153" text-anchor="middle" font-size="10" fill="#D6EAF8">index.html</text>

  <!-- User <-> Frontend -->
  <line x1="116" y1="140" x2="205" y2="140" stroke="#3A4A42" stroke-width="1.4" marker-end="url(#arrowEnd)"/>
  <rect x="134" y="119" width="52" height="14" fill="#FFFFFF" fill-opacity="0.92" rx="3"/>
  <text x="160" y="129" text-anchor="middle" font-size="9.5" fill="#5B6B63">message</text>

  <line x1="210" y1="152" x2="122" y2="152" stroke="#3A4A42" stroke-width="1.4" marker-end="url(#arrowEnd)"/>
  <rect x="140" y="159" width="40" height="14" fill="#FFFFFF" fill-opacity="0.92" rx="3"/>
  <text x="160" y="169" text-anchor="middle" font-size="9.5" fill="#5B6B63">reply</text>

  <!-- ============ Flask ============ -->
  <rect x="420" y="112" width="160" height="56" rx="10" fill="#1C5C4E"/>
  <text x="500" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Flask Server</text>
  <text x="500" y="153" text-anchor="middle" font-size="10" fill="#D9EDE6">app.py</text>

  <!-- Frontend <-> Flask -->
  <line x1="360" y1="140" x2="415" y2="140" stroke="#3A4A42" stroke-width="1.4" marker-end="url(#arrowEnd)"/>
  <rect x="341" y="119" width="94" height="14" fill="#FFFFFF" fill-opacity="0.92" rx="3"/>
  <text x="388" y="129" text-anchor="middle" font-size="9.5" fill="#5B6B63">POST /api/chat</text>

  <line x1="420" y1="152" x2="365" y2="152" stroke="#3A4A42" stroke-width="1.4" marker-end="url(#arrowEnd)"/>
  <rect x="353" y="159" width="70" height="14" fill="#FFFFFF" fill-opacity="0.92" rx="3"/>
  <text x="388" y="169" text-anchor="middle" font-size="9.5" fill="#5B6B63">JSON reply</text>

  <!-- ============ Strands Agent (center hub) ============ -->
  <rect x="380" y="270" width="240" height="76" rx="14" fill="#1C5C4E"/>
  <text x="500" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Strands Agent</text>
  <text x="500" y="317" text-anchor="middle" font-size="10.5" fill="#D9EDE6">system prompt + tool orchestration</text>
  <text x="500" y="333" text-anchor="middle" font-size="10.5" fill="#D9EDE6">decides which tool to call, if any</text>

  <!-- Flask -> Strands -->
  <line x1="500" y1="168" x2="500" y2="265" stroke="#3A4A42" stroke-width="1.4" marker-end="url(#arrowEnd)"/>
  <rect x="497" y="212" width="140" height="14" fill="#FFFFFF" fill-opacity="0.92" rx="3"/>
  <text x="567" y="222" text-anchor="middle" font-size="9.5" fill="#5B6B63">invoke agent(message)</text>

  <!-- ============ Bedrock/Claude ============ -->
  <rect x="130" y="420" width="230" height="76" rx="14" fill="#2874A6"/>
  <text x="245" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Amazon Bedrock</text>
  <text x="245" y="466" text-anchor="middle" font-size="10.5" fill="#D6EAF8">Claude Sonnet 4.6</text>
  <text x="245" y="481" text-anchor="middle" font-size="10.5" fill="#D6EAF8">reasoning &amp; response generation</text>

  <!-- Strands <-> Bedrock: two parallel one-way arrows (never cross), each a standard arrowhead -->
  <line x1="430" y1="346" x2="300" y2="420" stroke="#3A4A42" stroke-width="1.4" marker-end="url(#arrowEnd)"/>
  <rect x="288" y="356" width="118" height="14" fill="#FFFFFF" fill-opacity="0.92" rx="3"/>
  <text x="347" y="366" text-anchor="middle" font-size="9.5" fill="#5B6B63">reasoning request</text>

  <line x1="330" y1="420" x2="460" y2="346" stroke="#3A4A42" stroke-width="1.4" marker-end="url(#arrowEnd)"/>
  <rect x="352" y="400" width="136" height="14" fill="#FFFFFF" fill-opacity="0.92" rx="3"/>
  <text x="420" y="410" text-anchor="middle" font-size="9.5" fill="#5B6B63">generated response</text>

  <!-- ============ Local Tools ============ -->
  <rect x="640" y="420" width="260" height="86" rx="14" fill="#B23A2E"/>
  <text x="770" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Local Python Tools</text>
  <text x="770" y="465" text-anchor="middle" font-size="9.5" fill="#FBEAE7">get_emergency_number · first_aid_steps</text>
  <text x="770" y="480" text-anchor="middle" font-size="9.5" fill="#FBEAE7">find_hospitals · find_blood_banks</text>
  <text x="770" y="495" text-anchor="middle" font-size="9.5" fill="#FBEAE7">geocode_location · submit_user_feedback</text>

  <!-- Strands <-> Local Tools: two parallel one-way arrows (never cross) -->
  <line x1="570" y1="346" x2="700" y2="420" stroke="#3A4A42" stroke-width="1.4" marker-end="url(#arrowEnd)"/>
  <rect x="627" y="356" width="64" height="14" fill="#FFFFFF" fill-opacity="0.92" rx="3"/>
  <text x="659" y="366" text-anchor="middle" font-size="9.5" fill="#5B6B63">tool call</text>

  <line x1="670" y1="420" x2="540" y2="346" stroke="#3A4A42" stroke-width="1.4" marker-end="url(#arrowEnd)"/>
  <rect x="565" y="400" width="80" height="14" fill="#FFFFFF" fill-opacity="0.92" rx="3"/>
  <text x="605" y="410" text-anchor="middle" font-size="9.5" fill="#5B6B63">tool result</text>

  <!-- ============ Tool dependencies, hanging off Local Tools ============ -->
  <rect x="560" y="550" width="170" height="60" rx="12" fill="#FFFFFF" stroke="#8A9A92" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="645" y="574" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5B6B63">knowledge_base.py</text>
  <text x="645" y="592" text-anchor="middle" font-size="9" fill="#8A9A92">hand-verified data only</text>

  <rect x="750" y="550" width="190" height="60" rx="12" fill="#FFFFFF" stroke="#8A9A92" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="845" y="574" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5B6B63">OpenStreetMap Nominatim</text>
  <text x="845" y="592" text-anchor="middle" font-size="9" fill="#8A9A92">free external geocoding API</text>

  <line x1="700" y1="506" x2="655" y2="545" stroke="#3A4A42" stroke-width="1.4" marker-end="url(#arrowEnd)"/>
  <line x1="820" y1="506" x2="840" y2="545" stroke="#3A4A42" stroke-width="1.4" marker-end="url(#arrowEnd)"/>
</svg>
