<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>জরুরি সহায় — Joruri Shohay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&family=Noto+Serif+Bengali:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F3;
    --bg-elevated: #FFFFFF;
    --text: #1C2521;
    --text-muted: #5B6B63;
    --border: #E3DFD3;
    --primary: #1C5C4E;
    --primary-soft: #E4EEE9;
    --emergency: #B23A2E;
    --emergency-soft: #FBEAE7;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(28, 37, 33, 0.06);
  }

  [data-theme="dark"] {
    --bg: #10201A;
    --bg-elevated: #16281F;
    --text: #EDEEEA;
    --text-muted: #9AAAA1;
    --border: #24382E;
    --primary: #5FBF9F;
    --primary-soft: #1C3A2E;
    --emergency: #E06A5C;
    --emergency-soft: #3A2320;
    --shadow: 0 2px 14px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
    transition: background 0.25s ease, color 0.25s ease;
    min-height: 100vh;
  }

  [lang-active="bn"] body,
  body[data-lang="bn"] { font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }

  .app {
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    padding: 20px 20px 0;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-mark svg { width: 18px; height: 18px; }

  .brand-name {
    font-family: 'Noto Serif Bengali', 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .brand-sub {
    font-size: 11.5px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--primary);
    display: inline-block;
    margin-right: 5px;
    animation: pulse 2.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(95, 191, 159, 0.4); }
    50% { opacity: 0.6; }
  }

  .controls {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .icon-btn:hover { border-color: var(--primary); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 17px; height: 17px; }

  .lang-btn {
    width: auto;
    padding: 0 13px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
  }

  /* Signature: thin ECG-style pulse line under header */
  .pulse-line {
    margin-top: 16px;
    height: 20px;
    width: 100%;
    opacity: 0.5;
  }
  .pulse-line path {
    fill: none;
    stroke: var(--primary);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @media (prefers-reduced-motion: reduce) {
    .status-dot { animation: none; }
  }

  /* ---------- Emergency strip ---------- */
  .emergency-strip {
    margin: 16px 20px 0;
    padding: 12px 14px;
    background: var(--emergency-soft);
    border: 1px solid var(--emergency);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .emergency-strip .label {
    font-size: 13px;
    color: var(--emergency);
    font-weight: 500;
    line-height: 1.4;
  }

  .emergency-strip .number {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--emergency);
    white-space: nowrap;
  }

  /* ---------- Chat ---------- */
  .chat {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
  }

  .msg {
    max-width: 82%;
    padding: 12px 15px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--primary);
    color: #FCFCF9;
    border-bottom-right-radius: 4px;
  }

  .msg.agent {
    align-self: flex-start;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-bottom-left-radius: 4px;
  }

  .msg.system {
    align-self: center;
    color: var(--text-muted);
    font-size: 12.5px;
    background: none;
    padding: 4px;
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 14px 16px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- Input ---------- */
  .input-row {
    padding: 14px 20px 20px;
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--border);
  }

  #messageInput {
    flex: 1;
    padding: 13px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    resize: none;
    outline: none;
  }
  #messageInput:focus { border-color: var(--primary); }

  #sendBtn {
    width: 48px;
    border-radius: var(--radius);
    border: none;
    background: var(--primary);
    color: #FCFCF9;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s ease;
  }
  #sendBtn:hover { opacity: 0.9; }
  #sendBtn:active { transform: scale(0.96); }
  #sendBtn svg { width: 18px; height: 18px; }

  .disclaimer {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 20px 14px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-row">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#FCFCF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21C12 21 4 15.5 4 9.5C4 6.5 6.5 4 9.5 4C11 4 12 5 12 5C12 5 13 4 14.5 4C17.5 4 20 6.5 20 9.5C20 15.5 12 21 12 21Z"/>
          </svg>
        </div>
        <div>
          <div class="brand-name" id="brandName">Joruri Shohay</div>
          <div class="brand-sub"><span class="status-dot"></span><span id="statusText">Active support</span></div>
        </div>
      </div>
      <div class="controls">
        <button class="lang-btn icon-btn" id="langToggle" title="Language">বাং</button>
        <button class="icon-btn" id="themeToggle" title="Theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </div>
    <svg class="pulse-line" viewBox="0 0 400 20" preserveAspectRatio="none">
      <path d="M0,10 L140,10 L152,10 L160,2 L170,18 L180,10 L400,10"/>
    </svg>
  </header>

  <div class="emergency-strip">
    <div class="label" id="emergencyLabel">Serious emergency? Call this number right now, don't wait</div>
    <div class="number">999</div>
  </div>

  <div class="chat" id="chat">
    <div class="msg system" id="introMsg">Describe your situation — your location and what's wrong help me assist you better.</div>
  </div>

  <div class="input-row">
    <textarea id="messageInput" rows="1" placeholder="Type your question..."></textarea>
    <button id="sendBtn" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2Z"/>
      </svg>
    </button>
  </div>
  <div class="disclaimer" id="disclaimerText">This is a demo project — for real emergencies, call 999 directly.</div>
</div>

<script>
  const STR = {
    bn: {
      brand: "জরুরি সহায়",
      status: "সক্রিয় সহায়তা",
      emergencyLabel: "গুরুতর জরুরি অবস্থা? দেরি না করে সরাসরি কল করুন",
      intro: "আপনার পরিস্থিতি লিখুন — অবস্থান ও কী সমস্যা হচ্ছে জানালে ভালো সাহায্য করতে পারব।",
      placeholder: "আপনার প্রশ্ন লিখুন...",
      disclaimer: "এটি একটি ডেমো প্রকল্প — প্রকৃত জরুরি অবস্থায় সরাসরি ৯৯৯ নম্বরে কল করুন।",
      langBtn: "EN",
      thinking: "উত্তর তৈরি হচ্ছে...",
      error: "দুঃখিত, একটি সমস্যা হয়েছে। আবার চেষ্টা করুন, অথবা সরাসরি ৯৯৯ এ কল করুন।"
    },
    en: {
      brand: "Joruri Shohay",
      status: "Active support",
      emergencyLabel: "Serious emergency? Call this number right now, don't wait",
      intro: "Describe your situation — your location and what's wrong help me assist you better.",
      placeholder: "Type your question...",
      disclaimer: "This is a demo project — for real emergencies, call 999 directly.",
      langBtn: "বাং",
      thinking: "Thinking...",
      error: "Sorry, something went wrong. Please try again, or call 999 directly."
    }
  };

  let lang = localStorage.getItem("joruri-lang") || "en";
  let theme = localStorage.getItem("joruri-theme") || "light";

  const $ = (id) => document.getElementById(id);

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("joruri-theme", theme);
  }

  function applyLang() {
    const t = STR[lang];
    document.body.setAttribute("data-lang", lang);
    document.documentElement.setAttribute("lang", lang);
    $("brandName").textContent = t.brand;
    $("statusText").textContent = t.status;
    $("emergencyLabel").textContent = t.emergencyLabel;
    $("introMsg").textContent = t.intro;
    $("messageInput").placeholder = t.placeholder;
    $("disclaimerText").textContent = t.disclaimer;
    $("langToggle").textContent = t.langBtn;
    localStorage.setItem("joruri-lang", lang);
  }

  $("themeToggle").addEventListener("click", () => {
    theme = theme === "light" ? "dark" : "light";
    applyTheme();
  });

  $("langToggle").addEventListener("click", () => {
    lang = lang === "bn" ? "en" : "bn";
    applyLang();
  });

  function addMessage(text, role) {
    const chat = $("chat");
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function showTyping() {
    const chat = $("chat");
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function hideTyping() {
    const el = $("typingIndicator");
    if (el) el.remove();
  }

  async function sendMessage() {
    const input = $("messageInput");
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    input.style.height = "auto";
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      hideTyping();
      if (data.reply) {
        addMessage(data.reply, "agent");
      } else {
        addMessage(STR[lang].error, "agent");
      }
    } catch (err) {
      hideTyping();
      addMessage(STR[lang].error, "agent");
    }
  }

  $("sendBtn").addEventListener("click", sendMessage);
  $("messageInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  $("messageInput").addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 140) + "px";
  });

  applyTheme();
  applyLang();
</script>
</body>
</html>
